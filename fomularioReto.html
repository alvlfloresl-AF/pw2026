<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>formulario reto</title>
    <style>
        body {
            background-color: #1a1e26;
            color: #94a3b8;
            font-family: sans-serif;
            padding: 40px;
        }
        label {
            display: block;
            margin-top: 25px;
            font-size: 14px;
        }
        input {
            width: 350px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #4a5568;
            color: white;
            padding: 8px 0;
            outline: none;
            display: block;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form>
        <label>Nombre</label>
        <input type="text">

        <label>Email</label>
        <input type="text">

        <button>Enviar</button>
    </form>
</body>
</html>
